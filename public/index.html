<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local chat</title>
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(1rem, 5vw, 3.5rem) 1rem;
      background: #eff4f2;
      color: #182b27;
      font: 1rem / 1.5 system-ui, sans-serif;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2rem);
      border: 1px solid #cadad4;
      border-radius: 1.25rem;
      background: #fff;
    }
    header, .composer { display: flex; align-items: center; gap: .75rem; }
    header { justify-content: space-between; flex-wrap: wrap; margin-bottom: 1.25rem; }
    h1 { margin: 0; font-size: 1.75rem; letter-spacing: -.035em; }
    #connection-status {
      padding: .25rem .65rem;
      border-radius: 2rem;
      background: #edf1ef;
      color: #3e514b;
      font-size: .875rem;
      font-weight: 600;
    }
    #connection-status[data-state="connected"] { background: #d9f3e7; color: #17573f; }
    #connection-status[data-state="disconnected"] { background: #fbeae5; color: #823822; }
    .room {
      min-height: 12rem;
      height: min(38vh, 22rem);
      margin: 1.25rem 0;
      padding: 1rem;
      overflow-y: auto;
      border: 1px solid #d6e3de;
      border-radius: .75rem;
      background: #f7faf9;
    }
    .room-controls { display: flex; justify-content: flex-end; margin-top: -.75rem; }
    #clear-chat { padding: .375rem .75rem; border-color: #a8bdb6; background: white; color: #175e49; }
    #empty { margin: 0; color: #4f6560; }
    #messages { margin: 0; padding: 0; list-style: none; }
    #messages li { overflow-wrap: anywhere; }
    #messages li + li { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid #d6e3de; }
    #messages p { margin: .125rem 0 0; }
    label { display: block; margin-bottom: .375rem; font-weight: 600; }
    input, button { font: inherit; border-radius: .5rem; }
    input { width: 100%; min-width: 0; padding: .625rem .75rem; border: 1px solid #a8bdb6; }
    #display-name { max-width: 15rem; }
    button { padding: .625rem 1rem; border: 1px solid transparent; background: #175e49; color: white; }
    button:disabled { background: #dde6e2; color: #455b54; }
    :focus-visible { outline: 2px solid #127059; outline-offset: 2px; }
    #feedback { margin: .75rem 0 0; color: #823822; }
    #feedback:empty { margin: 0; }
  </style>
  <script type="module" src="/chat.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Local chat</h1>
      <span id="connection-status" role="status">Connecting…</span>
    </header>

    <form id="chat-form">
      <label for="display-name">Display name</label>
      <input id="display-name" name="name" maxlength="24" autocomplete="off" required>

      <div class="room">
        <p id="empty">No messages yet.</p>
        <ul id="messages" role="log" aria-label="Chat messages"></ul>
      </div>
      <div class="room-controls">
        <button id="clear-chat" type="button">Clear chat</button>
      </div>

      <label for="message">Message</label>
      <div class="composer">
        <input id="message" name="message" maxlength="500" autocomplete="off" required>
        <button id="send" type="submit" disabled>Send</button>
      </div>
      <p id="feedback" role="status"></p>
    </form>
  </main>
</body>
</html>
